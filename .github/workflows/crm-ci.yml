name: CRM checks

on:
  pull_request:
    paths: ['crm/**', '.github/workflows/crm-ci.yml']
  push:
    branches: ['main']
    paths: ['crm/**', '.github/workflows/crm-ci.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
