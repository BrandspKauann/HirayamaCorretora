name: Publicar artigo programado

on:
  schedule:
    - cron: '0 15 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar um artigo vencido
        id: publication
        run: |
          npm run publish:scheduled
          if git diff --quiet -- content/published-scheduled-posts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validar o build
        if: steps.publication.outputs.changed == 'true'
        run: npm run build
      - name: Commitar publicação
        if: steps.publication.outputs.changed == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content site
            git commit -m "Publica artigo programado"
            git push
          else
            echo "Nenhum artigo vencido para publicar."
          fi
