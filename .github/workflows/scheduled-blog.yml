name: Publicar artigo programado

on:
  schedule:
    - cron: '0 15 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Publicar um artigo vencido
        run: npm run publish:scheduled
      - name: Validar o build
        run: npm run build
      - name: Commitar publicação
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content site
            git commit -m "Publica artigo programado"
            git push
          else
            echo "Nenhum artigo vencido para publicar."
          fi
